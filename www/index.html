<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hidden Object Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="screenMenu" class="screen">
  <div id="menuBg"></div>
  <div id="menuBgClear"></div>
  <div id="menuOverlay">
    <h1 class="gameTitle">Hidden Object Adventures</h1>
    <button id="playBtn" class="menuBtn">▶ Play</button>
    <button id="chooseLevelBtn" class="menuBtn">☰ Choose Level</button>
    <button id="exitBtn" class="menuBtn exitBtnStyle">✕ Exit</button>
  </div>
</div>

<div id="screenLevelSelect" class="screen hidden">
  <div id="levelSelectTop">
    <button id="levelBackBtn" class="iconBtn">←</button>
    <div id="pageIndicator"></div>
  </div>
  <div id="levelGridWrap">
    <div id="levelGrid"></div>
  </div>
</div>

<div id="screenGame" class="screen hidden">
  <div id="topbar">
    <button id="gameBackBtn" class="iconBtn">←</button>
    <div id="hearts"></div>
    <div id="hintBtnWrap">
      <button id="hintBtn">🔍<span id="hintCount">3</span></button>
    </div>
  </div>
  <div id="gameArea">
    <div id="gameAreaBg"></div>
    <canvas id="gameCanvas"></canvas>
  </div>
  <div id="trayRow"></div>
</div>

<div id="winOverlay" class="overlay hidden">
  <h1>Puzzle Complete!</h1>
  <button id="nextBtn">Continue</button>
</div>
<div id="loseOverlay" class="overlay hidden">
  <h1>Out of Lives!</h1>
  <button id="retryBtn">Retry Puzzle</button>
</div>

<script src="game.js"></script>
</body>
</html>
